spring.application.name=bikerental

# Local defaults + Railway-compatible environment variables.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:bike_rental}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

server.port=${PORT:8080}
server.error.include-message=always

# Admin credentials must come from environment variables.
# No default username/password is stored in source control.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Uploads are stored here. On Railway, point UPLOAD_DIR to a mounted volume path.
app.upload.dir=${UPLOAD_DIR:uploads}

# Use * locally, or a comma-separated list of frontend origins in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Image upload limits.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT authentication. Set JWT_SECRET to a private random string of at least 32 characters.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}

# Email OTP verification (SMTP). Keep credentials in environment variables only.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.otp.email.expiry-minutes=${EMAIL_OTP_EXPIRY_MINUTES:5}
app.otp.email.resend-seconds=${EMAIL_OTP_RESEND_SECONDS:60}
app.otp.email.max-attempts=${EMAIL_OTP_MAX_ATTEMPTS:5}
