spring.application.name=bikerental

# Local defaults + Railway-compatible environment variables.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:bike_rental}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

server.port=${PORT:8080}
server.error.include-message=always

# Demo admin credentials. Override these in production/Railway variables.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:1234}

# Uploads are stored here. On Railway, point UPLOAD_DIR to a mounted volume path.
app.upload.dir=${UPLOAD_DIR:uploads}

# Use * locally, or a comma-separated list of frontend origins in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Image upload limits.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
